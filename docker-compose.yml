version: '3.8'

services:
  # Pixelle MCP Demo Service
  pixelle:
    build: .
    ports:
      - "8004:8004"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PORT=8004
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped 